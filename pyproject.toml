[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-uncertainty"
version = "0.1.0"
description = "Post-hoc confidence calibration and OOD detection for YOLOv8 on aerial imagery"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Serhii Naumenko", email = "sergey.naumenko94@gmail.com" }]
requires-python = ">=3.11"
keywords = ["yolo", "object-detection", "calibration", "uncertainty", "OOD", "aerial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ultralytics>=8.2",
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "netcal>=1.3",
    "mapie>=0.8",
    "wandb>=0.17",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "ipykernel>=6.29",
    "jupyterlab>=4.1",
]

[project.scripts]
yolo-calibrate = "yolo_uncertainty.cli:calibrate"
yolo-report    = "yolo_uncertainty.cli:report"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=yolo_uncertainty --cov-report=term-missing"
